services:

  web:
    build:
      context: .
      dockerfile: docker/dockerfile
    container_name: employee_pro
    ports:
      - "8999:80"
    volumes: 
      - ./app:/var/www/html 
    networks:
      - employee
    depends_on: 
      - mysql


  mysql:
    image: mysql:8.0
    container_name: employee_db

    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    networks:
      - employee

    volumes:
      - ./db:/docker-entrypoint-initdb.d


networks:
  employee:
    driver: bridge
